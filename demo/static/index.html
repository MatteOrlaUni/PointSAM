<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>PointSAM — Segmentazione Tronchi</title>
    <link rel="stylesheet" href="/static/style.css">
    <script type="importmap"> 
        { 
            "imports": { 
                "three": "https://unpkg.com/three@0.162.0/build/three.module.js", 
                "three/addons/": "https://unpkg.com/three@0.162.0/examples/jsm/" 
             } 
        } 
    </script>
</head>

<body>
<div id="container">
    <div id="sidebar">
        <div id="tool-box">
            <h3 style="margin:0 0 12px 0; color:#eee; font-size:14px;">PointSAM × PointCloud</h3>

            <!-- Segmentazione automatica (sostituisce il click) -->
            <button id="btn-segment">▶ Segmenta Tronchi</button>

            <!-- Utility -->
            <button id="btn-clear">✕ Reset Visualizzazione</button>
            <button id="btn-save">💾 Salva Risultati</button>

            <!-- Barra di stato -->
            <div id="status" style="
                margin-top: 16px;
                padding: 8px;
                background: #1a1a2e;
                border-radius: 4px;
                color: #adf;
                font-size: 12px;
                word-break: break-word;
            ">In attesa...</div>

            <!-- Legenda colori maschere -->
            <div style="margin-top:16px; font-size:11px; color:#888;">
                <div>● Giallo = punto prompt</div>
                <div>● Colori = tronchi segmentati</div>
            </div>
        </div>
    </div>
    <div id="preview">
        <canvas id="viewer"></canvas>
    </div>
    </div>
</div>
<script type="module" src="/static/viewer.js"></script>
<script type="module" src="/static/annotate.js"></script>
</body>

</html>
